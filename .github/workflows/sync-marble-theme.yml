name: Sync Marble CSS to zkThemeTemplate

on:
  push:
    branches: [ "marble" ]
    paths:
      - 'zul/src/main/resources/web/zul/css/**'
      - 'zul/src/main/resources/web/js/zul/*/css/**'
      - 'zul/src/main/resources/web/zul/img/marble/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout zk (full history, needed to walk the pushed commit range)
        uses: actions/checkout@v4
        with:
          path: zk
          fetch-depth: 0

      - name: Checkout zkThemeTemplate
        uses: actions/checkout@v4
        with:
          repository: zkoss/zkThemeTemplate
          ref: marble
          ssh-key: '${{ secrets.ZKTHEMETEMPLATE_DEPLOY_KEY }}'
          path: zkThemeTemplate

      - name: Replay each zk commit as its own commit in zkThemeTemplate
        shell: bash
        run: |
          set -euo pipefail

          SRC_ZUL_REL="zul/src/main/resources/web/zul/css"
          SRC_JS_REL="zul/src/main/resources/web/js/zul"
          SRC_IMG_REL="zul/src/main/resources/web/zul/img/marble"
          DST_ZUL="zkThemeTemplate/src/main/resources/web/zul/css"
          DST_IMG="zkThemeTemplate/src/main/resources/web/zul/img/marble"
          DST_PATHS="src/main/resources/web/zul/css src/main/resources/web/js/zul src/main/resources/web/zul/img/marble"
          DST_JS="zkThemeTemplate/src/main/resources/web/js/zul"

          git -C zkThemeTemplate config user.name "github-actions[bot]"
          git -C zkThemeTemplate config user.email "github-actions[bot]@users.noreply.github.com"

          sync_one_commit () {
            sha="$1"
            rm -rf /tmp/zk-css-extract
            mkdir -p /tmp/zk-css-extract
            git -C zk archive "$sha" -- "$SRC_ZUL_REL" "$SRC_JS_REL" "$SRC_IMG_REL" | tar -x -C /tmp/zk-css-extract

            rsync -a --delete "/tmp/zk-css-extract/$SRC_ZUL_REL"/ "$DST_ZUL"/
            mkdir -p "$DST_IMG"
            rsync -a --delete "/tmp/zk-css-extract/$SRC_IMG_REL"/ "$DST_IMG"/

            find "/tmp/zk-css-extract/$SRC_JS_REL" -type d -name css | while IFS= read -r dir; do
              rel="${dir#/tmp/zk-css-extract/$SRC_JS_REL/}"
              mkdir -p "$DST_JS/$rel"
              rsync -a --delete "$dir"/ "$DST_JS/$rel"/
            done

            # stage first: `git diff` alone would not see newly added files
            git -C zkThemeTemplate add -A -- $DST_PATHS
            if git -C zkThemeTemplate diff --cached --quiet -- $DST_PATHS; then
              echo "  (no net CSS change at $sha, skipping)"
              return
            fi

            subject=$(git -C zk log -1 --format='%s' "$sha")
            body=$(git -C zk log -1 --format='%b' "$sha")
            author_name=$(git -C zk log -1 --format='%an' "$sha")
            author_email=$(git -C zk log -1 --format='%ae' "$sha")
            author_date=$(git -C zk log -1 --format='%ad' --date=iso-strict "$sha")

            msg="$subject"
            if [ -n "$body" ]; then
              msg="$msg

          $body"
            fi
            msg="$msg

          Synced-from: zkoss/zk@$sha"

            GIT_AUTHOR_DATE="$author_date" git -C zkThemeTemplate commit --author="$author_name <$author_email>" -m "$msg"
            echo "  committed for $sha"
          }

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          ZERO_SHA="0000000000000000000000000000000000000000"

          if [ "$BEFORE" = "$ZERO_SHA" ] || ! git -C zk rev-parse --quiet --verify "$BEFORE^{commit}" >/dev/null; then
            echo "==> No usable 'before' commit (new branch or force-push); syncing HEAD only"
            sync_one_commit "$AFTER"
          else
            echo "==> Replaying commits $BEFORE..$AFTER"
            git -C zk rev-list --reverse --first-parent "$BEFORE..$AFTER" | while IFS= read -r sha; do
              echo "==> $sha"
              sync_one_commit "$sha"
            done
          fi

      # zkcml's sync workflow pushes to the same branch (disjoint paths), so the remote may
      # have moved since the checkout; rebase and retry.
      - name: Push synced commits
        working-directory: zkThemeTemplate
        run: |
          set -euo pipefail
          if [ -z "$(git log origin/marble..HEAD --oneline)" ]; then
            echo "No new commits to push."
            exit 0
          fi
          for attempt in 1 2 3; do
            if git push origin marble; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), rebasing onto origin/marble"
            git pull --rebase origin marble
          done
          echo "Push failed after 3 attempts" >&2
          exit 1
